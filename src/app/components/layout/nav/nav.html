<div class="relative flex h-full flex-col justify-between py-3 text-content">
  <div class="flex justify-center pt-2">
    <app-logo [mostrarNombre]="isExpanded()" />
  </div>

  <nav class="flex flex-col gap-2 px-2">
    <button
      type="button"
      class="navbutton"
      [class.justify-center]="!isExpanded()"
      (click)="gastosService.abrirModal('tarjeta')"
    >
      <ng-icon name="heroCreditCard" size="22" class="shrink-0" />
      <span [class.hidden]="!isExpanded()">Tarjeta</span>
    </button>
    <button
      type="button"
      class="navbutton"
      [class.justify-center]="!isExpanded()"
      (click)="gastosService.abrirModal('servicio')"
    >
      <ng-icon name="heroDocumentCurrencyDollar" size="22" class="shrink-0" />
      <span [class.hidden]="!isExpanded()">Servicio</span>
    </button>
    <button type="button" class="navbutton" [class.justify-center]="!isExpanded()">
      <ng-icon name="heroPlus" size="22" class="shrink-0" />
      <span [class.hidden]="!isExpanded()">Next</span>
    </button>
    <button type="button" class="navbutton" [class.justify-center]="!isExpanded()">
      <ng-icon name="heroPlus" size="22" class="shrink-0" />
      <span [class.hidden]="!isExpanded()">Algo mas</span>
    </button>
  </nav>

  <div class="flex flex-col gap-2 px-2">
    <button
      type="button"
      class="navbutton"
      [class.justify-center]="!isExpanded()"
      (click)="theme.toggle()"
    >
      <ng-icon
        [name]="theme.tema() === 'dark' ? 'heroSun' : 'heroMoon'"
        size="22"
        class="shrink-0"
      />
      <span [class.hidden]="!isExpanded()">
        {{ theme.tema() === 'dark' ? 'Modo claro' : 'Modo oscuro' }}
      </span>
    </button>
    <button
      type="button"
      class="navbutton hover:text-red-500"
      [class.justify-center]="!isExpanded()"
      (click)="auth.logOut()"
    >
      <ng-icon name="heroArrowLeftStartOnRectangle" size="22" class="shrink-0" />
      <span [class.hidden]="!isExpanded()">Logout</span>
    </button>

    <div class="pt-2 text-center text-xs text-content-muted">
      <span [class.hidden]="!isExpanded()">Iván Mendoza</span>
      <p>v1.0</p>
    </div>
  </div>

  <button
    type="button"
    aria-label="Expandir o colapsar menú"
    class="absolute -right-4 top-1/2 flex h-8 w-8 cursor-pointer items-center justify-center rounded-full border border-surface-border bg-surface text-content-muted transition hover:text-content"
    (click)="toggle()"
  >
    <ng-icon name="heroArrowsRightLeft" size="16" />
  </button>
</div>
