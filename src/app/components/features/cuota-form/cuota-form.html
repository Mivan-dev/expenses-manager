<div class="modal-overlay">
  <div class="modal-panel">
    <h4 class="pb-6 text-xl font-bold">Cuotas</h4>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      <input type="text" formControlName="nombre" placeholder="Nombre: Celular" class="modalForm" />
      <input
        type="text"
        formControlName="cuotaActual"
        placeholder="Cuota actual: 1"
        class="modalForm"
      />
      <input
        type="text"
        formControlName="cuotaTotal"
        placeholder="Cuota total: 6"
        class="modalForm"
      />
      <input type="text" formControlName="monto" placeholder="Monto: $70.000" class="modalForm" />
      <button type="submit" class="btn-primary">Cargar Cuota</button>
      <button type="button" class="btn-ghost" (click)="gastosService.cerrarModal()">
        Cancelar
      </button>
    </form>
  </div>
</div>
