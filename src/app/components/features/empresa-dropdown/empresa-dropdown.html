<button
  type="button"
  class="modalForm flex items-center gap-2 text-left"
  (click)="toggle(); $event.stopPropagation()"
>
  @if (seleccionada()) {
    <img [src]="seleccionada()!.icono" class="h-8 w-8 rounded-full object-cover" alt="" />
    <span>{{ seleccionada()!.nombre }}</span>
  } @else {
    <span class="py-1 italic text-content-muted">Seleccionar empresa</span>
  }
</button>

@if (dropdown()) {
  <div
    class="absolute left-0 right-0 top-full z-30 mt-1 max-h-60 overflow-y-auto rounded-xl border border-surface-border bg-surface shadow-lg"
  >
    @for (empresa of empresas(); track empresa.id) {
      <button
        type="button"
        class="flex w-full cursor-pointer items-center gap-2 px-4 py-2 text-left transition hover:bg-content/10"
        (click)="empresaElegida(empresa)"
      >
        <img [src]="empresa.icono" class="h-8 w-8 rounded-full object-cover" alt="" />
        <span>{{ empresa.nombre }}</span>
      </button>
    }
  </div>
}
