<div class="modal-overlay">
  <div class="modal-panel">
    <h4 class="pb-6 text-xl font-bold">Credenciales</h4>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      <select
        formControlName="etiqueta1"
        class="modalForm"
        [class.text-content-muted]="!form.value.etiqueta1"
      >
        <option value="" disabled selected>Seleccionar tipo de credencial 1</option>
        @for (etiqueta of etiquetas; track etiqueta) {
          <option [value]="etiqueta">{{ etiquetaLabels[etiqueta] }}</option>
        }
      </select>
      <input
        type="text"
        formControlName="valor1"
        placeholder="Número identificador"
        class="modalForm"
      />

      <select
        formControlName="etiqueta2"
        class="modalForm"
        [class.text-content-muted]="!form.value.etiqueta2"
      >
        <option value="" disabled selected>Seleccionar tipo de credencial 2 (opcional)</option>
        @for (etiqueta of etiquetas; track etiqueta) {
          <option [value]="etiqueta">{{ etiquetaLabels[etiqueta] }}</option>
        }
      </select>
      <input
        type="text"
        formControlName="valor2"
        placeholder="Número identificador"
        class="modalForm"
      />

      <button type="submit" class="btn-primary">Agregar</button>
      <button type="button" class="btn-ghost" (click)="gastosService.cerrarModal()">
        Cancelar
      </button>
    </form>
  </div>
</div>
