<div class="modal-overlay">
  <div class="modal-panel">
    <h4 class="pb-6 text-xl font-bold">Servicio</h4>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      <input type="text" formControlName="nombre" placeholder="Nombre: Luz" class="modalForm" />
      <div class="relative">
        <app-empresa-dropdown
          [empresas]="gastosService.empresa()"
          (empresaSeleccionada)="form.patchValue({ empresaId: $event })"
        />
        <ng-icon
          name="heroChevronDown"
          size="16"
          class="pointer-events-none absolute right-4 top-1/2 z-20 -translate-y-1/2 text-content-muted"
        />
      </div>
      <input type="text" formControlName="monto" placeholder="Monto: $28.000" class="modalForm" />
      <input type="date" formControlName="vencimiento" class="modalForm" />
      <button type="submit" class="btn-primary">Agregar</button>
      <button type="button" class="btn-ghost" (click)="gastosService.cerrarModal()">
        Cancelar
      </button>
    </form>
  </div>
</div>
